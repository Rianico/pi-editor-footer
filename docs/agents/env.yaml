project: pi-editor-footer
provider: github
remote_url: https://github.com/Rianico/pi-editor-footer.git
steering_file: AGENTS.md
domain_layout:
  glossary: GLOSSARY.md
  glossary_map: GLOSSARY-MAP.md
  adr_dir: docs/adr
  stale_files:
    CONTEXT.md: GLOSSARY.md
runtime:
  tmp: .lsz/tmp
toolchain:
  adr:
    detected: true
    fallback: manual directory + template
  fd:
    detected: true
    fallback: find
  rg:
    detected: true
    fallback: grep
  eza:
    detected: true
    fallback: ls / tree
  wt:
    detected: true
    fallback: git worktree
  uv:
    detected: true
    fallback: pip / python -m venv
  oxlint:
    detected: false
    fallback: ruff / eslint
  oxfmt:
    detected: false
    fallback: prettier
  basedpyright:
    detected: true
    fallback: pyright / mypy
