name: Pinned pi versions

# #44's whole cost was a stale node_modules: pi-tui 0.84.2 and pi-coding-agent
# 0.85.1 installed while the lockfile pinned 1.3.0, which presents as five tsc
# errors and four failing suites — indistinguishable from a real breaking
# change. This job fails that state in seconds on every PR instead of letting it
# reach a reviewer.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pins:
    runs-on: ubuntu-latest
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      # v6.1.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          run_install: false
      # v7.0.0 (no action cache: keeps zizmor's cache-poisoning rule quiet)
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26
      - run: pnpm install --frozen-lockfile
      - name: Installed pi packages must equal the pinned versions
        run: node --import tsx scripts/check-pinned-versions.ts
