name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0, persist-credentials: true }
      - run: git fetch --prune --tags --force
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4  # zizmor: ignore[cache-poisoning]
        with: { node-version: 22 } # zizmor: ignore[cache-poisoning]
      - run: npm ci
      - run: npm run build
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
      - run: gh release create ${{ github.ref_name }} --generate-notes --verify-tag
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
# Alternative continuous: on: push: branches: [main] — document as comment, not default.
